<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Performace — Personal Performance Tracker</title>
    <meta
      name="description"
      content="Track diet, sleep, gym, reading, school, meetings, and your Orthodox rule of life — and turn all of it into a real daily schedule."
    />

    <!-- Browser chrome follows the app's own light/dark surfaces. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef7fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050a0d" />

    <!-- iOS has no manifest support for these; they are what make an installed
         home-screen app open without Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Performace" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050a0d'/%3E%3Ccircle cx='16' cy='16' r='11' stroke='%2300d4ff' stroke-width='1.6' fill='none' opacity='0.55'/%3E%3Cpath d='M9 20.5l4.5-5 3.5 3.5L23 11' stroke='%2300d4ff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
